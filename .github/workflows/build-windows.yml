name: Build Windows Browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile Microbrowser
        shell: cmd
        run: call build.cmd

      - name: Verify generated binary
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Microbrowser.exe")) { throw "Microbrowser.exe missing" }
          Get-Item "dist/Microbrowser.exe" | Select-Object Name, Length
          Get-FileHash "dist/Microbrowser.exe" -Algorithm SHA256 | Format-List

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Microbrowser-Windows-x64
          path: dist/Microbrowser.exe
          if-no-files-found: error
          retention-days: 14
