name: Security Check (Windows Defender)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Rebuild from source
        shell: cmd
        run: call build.cmd

      - name: Run on-demand Windows Defender scan
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/Microbrowser.exe").Path
          $status = Get-MpComputerStatus
          Write-Host "AntivirusEnabled: $($status.AntivirusEnabled)"
          Write-Host "AMServiceEnabled: $($status.AMServiceEnabled)"
          Write-Host "RealTimeProtectionEnabled: $($status.RealTimeProtectionEnabled)"
          Write-Host "AntivirusSignatureVersion: $($status.AntivirusSignatureVersion)"
          if (!$status.AntivirusEnabled -or !$status.AMServiceEnabled) {
            throw "Windows Defender is unavailable; scan result cannot be verified."
          }
          $scanStarted = Get-Date
          Start-MpScan -ScanType CustomScan -ScanPath $exe -ErrorAction Stop
          $detections = @(Get-MpThreatDetection -ErrorAction SilentlyContinue |
            Where-Object { $_.InitialDetectionTime -ge $scanStarted.AddMinutes(-1) })
          if ($detections.Count -gt 0) {
            $detections | Format-List | Out-String | Write-Host
            throw "Windows Defender reported a recent detection; investigate the result."
          }
          Write-Host "Defender on-demand scan completed with no new detections reported."
          Write-Host "This is not a comprehensive security audit."
